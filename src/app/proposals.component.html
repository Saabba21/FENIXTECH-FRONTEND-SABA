<div class="row g-4 mb-4">
  <div class="col-12">
    <h2 class="fw-bold m-0">Gestión de Solicitudes</h2>
  </div>
</div>

<div class="table-responsive bg-white border rounded shadow-sm p-3">
  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Propuesta</th>
        <th>Usuario</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Fila en modo vista -->
      <tr>
        <td class="fw-medium">Quiero que vendan teclados mecánicos 60%</td>
        <td>maria_dev</td>
        <td><span class="badge bg-primary">OPEN</span></td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-secondary me-2" title="Editar Estado"><i class="bi bi-pencil-fill"></i></button>
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
        </td>
      </tr>
      <!-- Fila en modo edición -->
      <tr>
        <td class="fw-medium">Añadir más monitores ultrawide</td>
        <td>carlos_gamer</td>
        <td>
          <div class="input-group input-group-sm w-auto d-inline-flex">
            <select class="form-select border-black bg-white">
              <option value="OPEN">OPEN</option>
              <option value="FULFILLED" selected>FULFILLED</option>
            </select>
            <button class="btn btn-success" title="Confirmar"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-danger" title="Cancelar"><i class="bi bi-x-lg"></i></button>
          </div>
        </td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-secondary me-2" disabled><i class="bi bi-pencil-fill"></i></button>
          <button class="btn btn-sm btn-outline-danger" disabled><i class="bi bi-trash"></i></button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
