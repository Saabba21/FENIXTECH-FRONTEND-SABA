<div class="row g-4 mb-4">
  <div class="col-12">
    <h2 class="fw-bold m-0">Gestión de Solicitudes</h2>
  </div>
</div>

<div class="table-responsive bg-white border rounded shadow-sm p-3">
  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Propuesta</th>
        <th>Usuario</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let proposal of proposals">
        
        <!-- Fila en modo vista -->
        <tr *ngIf="editingId !== proposal.proposalId">
          <td class="fw-medium">{{ proposal.title }}</td>
          <td>{{ proposal.requester?.firstName || 'N/A' }}</td>
          <td><span class="badge" [ngClass]="proposal.status === 'OPEN' ? 'bg-primary' : 'bg-success'">{{ proposal.status }}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-2" title="Editar Estado" (click)="startEdit(proposal)"><i class="bi bi-pencil-fill"></i></button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteProposal(proposal.proposalId)"><i class="bi bi-trash"></i></button>
          </td>
        </tr>

        <!-- Fila en modo edición -->
        <tr *ngIf="editingId === proposal.proposalId" class="table-warning">
          <td class="fw-medium">{{ proposal.title }}</td>
          <td>{{ proposal.requester?.firstName || 'N/A' }}</td>
          <td>
            <div class="input-group input-group-sm w-auto d-inline-flex">
              <select class="form-select border-black bg-white" [(ngModel)]="editStatus">
                <option value="OPEN">OPEN</option>
                <option value="FULFILLED">FULFILLED</option>
              </select>
              <button class="btn btn-success" title="Confirmar" (click)="confirmEdit(proposal)"><i class="bi bi-check-lg"></i></button>
              <button class="btn btn-danger" title="Cancelar" (click)="cancelEdit()"><i class="bi bi-x-lg"></i></button>
            </div>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-2" disabled><i class="bi bi-pencil-fill"></i></button>
            <button class="btn btn-sm btn-outline-danger" disabled><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </ng-container>
      <tr *ngIf="proposals.length === 0"><td colspan="4" class="text-center text-muted">No hay propuestas.</td></tr>
    </tbody>
  </table>
</div>
