<div class="row g-4 mb-4">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h2 class="fw-bold m-0">Insignias Corporativas</h2>
    <button class="btn btn-primary fw-medium" (click)="openAssignForm()"><i class="bi bi-award-fill"></i> Asignar Insignia</button>
  </div>
</div>

<!-- Formulario Asignar Insignia -->
<div *ngIf="showAssignForm" class="card mb-4 p-3 shadow-sm border-0 bg-light">
  <h5 class="fw-bold mb-3">Asignar Nueva Insignia</h5>
  
  <div *ngIf="errorMessage" class="alert alert-danger mb-3 py-2 px-3 d-flex align-items-center gap-2">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <div class="row g-3">
    <div class="col-md-5">
      <label class="form-label">Empresa</label>
      <select class="form-select form-select-sm" [(ngModel)]="assignForm.companyId">
        <option *ngFor="let c of companies" [value]="c.companyId">{{ c.companyName }}</option>
      </select>
    </div>
    <div class="col-md-5">
      <label class="form-label">ID de Insignia</label>
      <input type="number" class="form-control form-control-sm" [(ngModel)]="assignForm.badgeId" placeholder="Ej: 1, 2, 3">
    </div>
    <div class="col-md-2 d-flex align-items-end gap-2">
      <button class="btn btn-sm btn-secondary w-100" (click)="cancelAssign()">Cancelar</button>
      <button class="btn btn-sm btn-success w-100" (click)="submitAssign()">Asignar</button>
    </div>
  </div>
</div>

<div class="table-responsive bg-white border rounded shadow-sm p-3">
  <table class="table align-middle">
    <thead class="table-light">
      <tr>
        <th>Empresa</th>
        <th>Insignias Asignadas</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let company of companies">
        <td class="fw-medium">{{ company.companyName }}</td>
        <td>
          <div class="d-flex flex-wrap gap-2">
            <span *ngFor="let badge of company.badges" class="badge bg-warning text-dark border p-2 d-flex align-items-center">
              <i class="bi bi-star-fill me-1"></i> {{ badge.name || 'Insignia' }}
              <button class="btn btn-link btn-sm text-danger p-0 ms-2" title="Revocar" (click)="revokeBadge(company.companyId, badge.badgeId)">
                <i class="bi bi-x-circle-fill"></i>
              </button>
            </span>
            <span *ngIf="company.badges?.length === 0" class="text-muted small">Sin insignias</span>
          </div>
        </td>
      </tr>
      <tr *ngIf="companies.length === 0"><td colspan="2" class="text-center text-muted">No hay empresas.</td></tr>
    </tbody>
  </table>
</div>
