<div class="row g-4 mb-4">
  <div class="col-12 d-flex justify-content-between align-items-center">
    <h2 class="fw-bold m-0">Gestión de Usuarios</h2>
  </div>
</div>

<div class="p-4 border rounded shadow-sm bg-light mb-4">
  <div class="row g-3 align-items-end">
    <div class="col-md-5">
      <label class="form-label fw-medium">Buscar Usuario</label>
      <div class="input-group">
        <input type="text" class="form-control border-black bg-white" placeholder="Nombre o email..." [(ngModel)]="searchQuery" (keyup.enter)="loadUsers()">
        <button class="btn btn-primary px-3" title="Buscar" (click)="loadUsers()"><i class="bi bi-search"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="table-responsive bg-white border rounded shadow-sm p-3">
  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td class="fw-medium">{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.email }}</td>
        <td><span class="badge bg-secondary">{{ user.role }}</span></td>
        <td>
          <span class="badge" [ngClass]="user.isActive ? 'bg-success' : 'bg-danger'">
            {{ user.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td class="text-end">
          <button class="btn btn-sm me-2" [ngClass]="user.isActive ? 'btn-outline-danger' : 'btn-outline-success'" (click)="toggleStatus(user)" [title]="user.isActive ? 'Desactivar' : 'Activar'">
            <i class="bi" [ngClass]="user.isActive ? 'bi-person-fill-slash' : 'bi-person-check-fill'"></i> 
            {{ user.isActive ? 'Desactivar' : 'Activar' }}
          </button>
        </td>
      </tr>
      <tr *ngIf="users.length === 0"><td colspan="5" class="text-center text-muted py-4">No se encontraron usuarios.</td></tr>
    </tbody>
  </table>
</div>
