<div class="row g-4 mb-4">
  <div class="col-12">
    <h2 class="fw-bold m-0">Estructura del Catálogo</h2>
  </div>
</div>

<div class="row g-4">
  <!-- Categorías -->
  <div class="col-md-6">
    <div class="p-4 border rounded shadow-sm bg-light h-100">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold">Categorías</h4>
        <button class="btn btn-primary btn-sm px-3" title="Añadir Categoría"><i class="bi bi-plus-lg"></i></button>
      </div>
      <table class="table bg-white border rounded">
        <tbody>
          <tr>
            <td class="fw-medium">Hardware</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
          <tr>
            <td class="fw-medium">Periféricos</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Subcategorías -->
  <div class="col-md-6">
    <div class="p-4 border rounded shadow-sm bg-light h-100">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold">Subcategorías</h4>
        <button class="btn btn-primary btn-sm px-3" title="Añadir Subcategoría"><i class="bi bi-plus-lg"></i></button>
      </div>
      <table class="table bg-white border rounded">
        <tbody>
          <tr>
            <td>
              <span class="fw-medium">Tarjetas Gráficas</span> 
              <br><small class="text-muted">En: Hardware</small>
            </td>
            <td class="text-end align-middle">
              <button class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
